<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>add product</title>

    <style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  background: #f5f7fa;
  font-family: "Segoe UI" Tahoma;
  padding: 20px;
}
.container {
  max-width: 1000px;
  margin: auto;
}
.header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}
.btn {
  padding: 8px 14px;
  border-radius: 6px;
  text-decoration: none;
  color: white;
  background: #2563eb;
}
.btn.secondary {
  background: white;
  color: #2563eb;
  border: 1px solid #2563eb;
}
</style>
</head>

<body>
<div class="container">

    <div class="header">
        <h2>COMPILER</h2>
        <div style="display: flex; gap: 10px;">
            <a href="index.html" class="btn secondary">product</a>
            <a href="add_product.html" class="btn">add product</a>
        </div>
    </div>

    

<form method="post" style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.08); max-width: 600px;">

    <div style="display: flex; gap: 15px;">
        <div>
            <label>product name</label>
            <input type="text" name="name" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;">
        </div>

        <div style="width: 180px;">
            <label>price</label>
            <input type="number" name="price" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;">
        </div>
    </div>

    <label>name image</label>
    <input type="text" name="image" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;">


    <label>description</label>
    <textarea name="description" style="width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 8px;"></textarea>

    <button type="submit" style="margin-top: 15px; padding: 10px 18px; background: #2563eb; color: white; border: none; border-radius: 8px;">
        save
    </button>
</form>



</div>
</body>
</html>
