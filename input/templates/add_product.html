{% extends "base.html" %}
{% block title %}add product{% endblock %}

{% block content %}

<form method="post" style="
    background:white; padding:20px; border-radius:10px;
    box-shadow:0px 4px 10px rgba(0,0,0,0.08);
    max-width:600px;
">

    <div style="display:flex; gap:15px;">
        <div>
            <label>product name</label>
            <input type="text" name="name"
                   style="width:100%; padding:10px; border:1px solid #ccc; border-radius:8px;">
        </div>

        <div style="width:180px;">
            <label>price</label>
            <input type="number" name="price"
                   style="width:100%; padding:10px; border:1px solid #ccc; border-radius:8px;">
        </div>
    </div>

    <label>name image</label>
    <input type="text" name="image"
           style="width:100%; padding:10px; border:1px solid #ccc; border-radius:8px;">


    <label>description</label>
    <textarea name="description"
              style="width:100%; height:100px; padding:10px; border:1px solid #ccc; border-radius:8px;"></textarea>

    <button type="submit"
            style="margin-top:15px; padding:10px 18px; background:#2563eb; color:white; border:none; border-radius:8px;">
        save
    </button>
</form>

{% endblock %}
