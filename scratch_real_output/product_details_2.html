<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>product detailes</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background:#f5f7fa; font-family:'Segoe UI', Tahoma; padding:20px; }
        .container { max-width:1000px; margin:auto; }
        .header { display:flex; justify-content:space-between; margin-bottom:20px; }
        .btn { padding:8px 14px; border-radius:6px; text-decoration:none; color:white; background:#2563eb; }
        .btn.secondary { background:white; color:#2563eb; border:1px solid #2563eb; }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h2>COMPILER</h2>
        <div style="display:flex; gap:10px;">
            <a href="/" class="btn secondary">product</a>
            <a href="/add" class="btn">add product</a>
        </div>
    </div>

    

<div style="display:grid; grid-template-columns:1fr 350px; gap:20px;">

    <img src="/static/images/dress.jpg"
         style="width:100%; height:400px; object-fit:cover; border-radius:10px;">


    <div style="
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0px 4px 10px rgba(0,0,0,0.08);
    ">
        <h2>Dress</h2>
        <div style="font-size:20px; color:#0ea5e9; font-weight:bold;">20</div>
        <p style="margin-top:10px;">Dress Baby Red.</p>
    </div>
</div>



</div>
</body>
</html>
