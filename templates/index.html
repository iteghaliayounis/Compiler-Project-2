{% extends "base.html" %}
{% block title %}The Products{% endblock %}

{% block content %}

<div style="
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:20px;
">

    {% for p in products %}
    <div style="
        background:white;
        padding:15px;
        border-radius:10px;
        box-shadow:0px 4px 10px rgba(0,0,0,0.08);
    ">

        <img src="{{ url_for('static', filename='images/' + p.image) }}"
             style="width:100%; height:150px; border-radius:8px; object-fit:cover;">
        <div style="font-weight:bold; margin-top:10px;">{{ p.name }}</div>
        <div style="color:#0ea5e9; font-weight:bold; margin:5px 0;">{{ p.price }}</div>

        <a href="{{ url_for('product_detail', pid=p.id) }}"
           class="btn secondary"
           style="display:inline-block; margin-top:8px;">
            detailes
        </a>

        <form action="{{ url_for('delete_product', pid=p.id) }}" method="POST" style="display:inline-block; margin-top:8px;">
            <button type="submit"
                    style="padding:6px 12px; border:none; border-radius:6px; background:#ef4444; color:white; cursor:pointer;">
                delete
            </button>
        </form>

    </div>
    {% endfor %}

</div>

{% endblock %}
